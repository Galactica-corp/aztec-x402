services:
  aztec-x402:
    build: .
    image: aztec-x402
    labels:
      deploy.url: "https://aztec-x402.unfazed.engineering"
    ports:
      - "1005:4402"
    environment:
      NODE_ENV: production
    volumes:
      - aztec-data:/app/packages/demo/src/aztec/data
    restart: unless-stopped

volumes:
  aztec-data:
