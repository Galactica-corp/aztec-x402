services:
  aztec-x402:
    build: .
    image: aztec-x402
    labels:
      deploy.url: "https://aztec-x402.unfazed.engineering"
    ports:
      - "1005:4402"
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Public v6 testnet RPC. Override with NODE_URL.
      NODE_URL: ${NODE_URL:-https://aztec-testnet.drpc.org}
    volumes:
      - aztec-data:/app/packages/demo/src/aztec/data
    restart: unless-stopped

volumes:
  aztec-data:
